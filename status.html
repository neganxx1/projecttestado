<section class="evu-store-panel" id="status" aria-labelledby="evu-status-title">
    <h1 id="evu-status-title">Product status</h1>
    <article class="evu-status-card">
        <img class="evu-status-cover" src="./rob-run-chair-neon-action.png" alt="" width="1254" height="1254" loading="lazy" decoding="async">
        <h2>ROB RUN CHAIR</h2>
        <span class="evu-status-badge" data-product-status="rob-run-chair" data-state="available" role="status">Available</span>
        <a class="evu-status-plans" href="./products.html">View plans</a>
    </article>
</section>
    </main>
    <script id="evu-status-config" type="application/json">
            {
                "rob-run-chair": { "state": "available", "label": "Available" }
            }
        </script>
    <script>
        const productStatuses = JSON.parse(document.getElementById("evu-status-config").textContent);
        for (const badge of document.querySelectorAll("[data-product-status]")) {
            const product = productStatuses[badge.dataset.productStatus];
            if (!product) continue;
            badge.dataset.state = product.state;
            badge.textContent = product.label;
        }
    </script>
