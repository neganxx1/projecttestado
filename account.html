<body class="account-page">
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="/">
                <img src="./EVU%20Core%20Crown%20Logo.png" alt="" width="44" height="44">
                <span>EVU <strong>CORE</strong></span>
            </a>
            <nav class="site-nav" aria-label="Store sections">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/status">Status</a>
                <a href="/rules">Rules</a>
                <a href="/account" aria-current="page">Account</a>
            </nav>
        </div>
    </header>
    <main class="store-main account-main">
        <section class="account-panel" aria-label="EVU CORE account">
            <div class="account-brand">
                <a class="account-close" href="/" aria-label="Return to home">×</a>
                <img src="./EVU%20Core%20Crown%20Logo.png" alt="EVU CORE" width="82" height="82">
            </div>
            <div class="account-content">
                <div id="account-guest" class="account-stack">
                    <h1 id="account-title">Sign in</h1>
                    <form id="email-login" class="account-stack">
                        <label for="account-email">Email address</label>
                        <input id="account-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required disabled>
                        <button type="submit" id="send-email-link" class="account-button account-button-primary" disabled>Send sign-in link</button>
                    </form>
                    <div class="account-divider">or</div>
                    <button type="button" id="google-login" class="account-button account-button-google" disabled>
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                            <path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.71h5.38c-.23 1.21-.92 2.24-1.96 2.92v2.45h3.17c1.85-1.71 3.01-4.24 3.01-7.12Z"/>
                            <path fill="#34A853" d="M12 22c2.64 0 4.85-.88 6.47-2.39l-3.17-2.45c-.88.58-2 .92-3.3.92-2.55 0-4.71-1.72-5.48-4.03H3.25v2.53A10 10 0 0 0 12 22Z"/>
                            <path fill="#FBBC05" d="M6.52 14.05a6 6 0 0 1 0-4.1V7.42H3.25a10 10 0 0 0 0 9.16l3.27-2.53Z"/>
                            <path fill="#EA4335" d="M12 5.92c1.44 0 2.73.5 3.74 1.46l2.8-2.8A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.75 5.42l3.27 2.53A5.82 5.82 0 0 1 12 5.92Z"/>
                        </svg>
                        Continue with Google
                    </button>
                    <p id="google-availability" class="account-provider-notice" hidden>Google sign-in is not available yet.</p>
                </div>
                <div id="account-profile" class="account-stack" hidden>
                    <h2>Signed in</h2>
                    <p id="account-profile-email"></p>
                    <button type="button" id="account-sign-out" class="account-button" disabled>Sign out</button>
                </div>
                <p id="account-setup" class="account-message" role="status">Checking account availability…</p>
                <p id="account-notice" class="account-message" role="status"></p>
                <noscript><p>Enable JavaScript to sign in.</p></noscript>
                <a class="account-privacy" href="/privacy">Privacy policy</a>
            </div>
        </section>
    </main>
</body>
